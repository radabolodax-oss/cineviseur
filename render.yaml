# Hébergement de l'API CineViseur sur Render (offre gratuite).
# Render > New > Blueprint > choisir le dépôt GitHub : ce fichier est lu automatiquement.
services:
  - type: web
    name: cineviseur-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URL
        sync: false # chaîne de connexion MongoDB Atlas, à coller dans Render
      - key: TMDB_API_KEY
        sync: false # même clé que dans backend/.env
      - key: DB_NAME
        value: cineviseur
      - key: JWT_SECRET
        generateValue: true # secret aléatoire, différent de celui du local
      - key: CORS_ORIGINS
        value: https://cineviseur.netlify.app
