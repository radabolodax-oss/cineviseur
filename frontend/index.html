<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineViseur - Suivez vos films et séries</title>
    <meta name="description" content="CineViseur garde la mémoire de vos écrans : listes de films et séries, alertes de sortie et cinémas près de chez vous." />
    <meta name="theme-color" content="#06070f" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Partage sur les réseaux sociaux (Open Graph / X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CineViseur" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="CineViseur - Suivez vos films et séries" />
    <meta property="og:description" content="Listes de films et séries, alertes de sortie et cinémas près de chez vous." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CineViseur, suivez tout ce que vous regardez" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CineViseur - Suivez vos films et séries" />
    <meta name="twitter:description" content="Listes de films et séries, alertes de sortie et cinémas près de chez vous." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-4993578792461847" />

    <!-- Les affiches viennent de TMDB : connexion ouverte dès le départ. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <script>
      window.__cvInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__cvInstallPrompt = e;
        window.dispatchEvent(new Event("cv:install-ready"));
      });
    </script>

    <!-- Neutralisation de tout filigrane tiers ou badge d'hébergeur (Netlify HUD, etc.) -->
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[id^="nl-"],
      iframe[title*="Netlify" i],
      iframe[srcdoc*="nl-badge"],
      div[class*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: fixed !important;
        bottom: -9999px !important;
        right: -9999px !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: circle(0) !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        function purgeNetlifyBadge() {
          var els = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify" i], script[src*="/.netlify/scripts/hud"]');
          for (var i = 0; i < els.length; i++) {
            els[i].remove();
          }
        }
        purgeNetlifyBadge();
        if (window.MutationObserver) {
          var obs = new MutationObserver(purgeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
